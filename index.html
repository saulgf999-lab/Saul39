<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>para mi botsita ❄️</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Fuente -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;
      background: linear-gradient(to bottom, #0f172a, #1e3a8a, #60a5fa);
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      color:white;
      text-align:center;
    }

    .contenido{
      z-index:2;
      padding:20px;
    }

    h1{
      font-size:4rem;
      margin-bottom:20px;
      text-shadow:0 0 15px rgba(255,255,255,0.6);
    }

    p{
      font-size:1.3rem;
      max-width:700px;
      line-height:1.8;
      text-shadow:0 0 10px rgba(0,0,0,0.4);
    }

    .btn-special{
      margin-top:30px;
      border-radius:30px;
      padding:12px 35px;
      font-weight:600;
      border:none;
      background:white;
      color:#1e3a8a;
      transition:0.3s;
    }

    .btn-special:hover{
      transform:scale(1.05);
      background:#dbeafe;
    }

    /* Nieve */
    .snowflake{
      position:absolute;
      top:-10px;
      color:white;
      user-select:none;
      animation:fall linear infinite;
    }

    @keyframes fall{
      to{
        transform:translateY(110vh);
      }
    }
  </style>
</head>

<body>

  <!-- Efecto nieve -->
  <script>
    for(let i = 0; i < 70; i++){
      let snow = document.createElement("div");

      snow.className = "snowflake";
      snow.innerHTML = "❄";

      snow.style.left = Math.random() * window.innerWidth + "px";
      snow.style.fontSize = (Math.random() * 20 + 10) + "px";
      snow.style.animationDuration = (Math.random() * 5 + 5) + "s";
      snow.style.opacity = Math.random();

      document.body.appendChild(snow);
    }
  </script>

  <!-- Contenido -->
  <div class="contenido">

    <h1>❄️ Te amo muchisimo mi amor ❄️</h1>

    <p>
      Gracias por estar siempre conmigo y dandome
      tu cariño mi amorcita eres unica y perfecta preciosa💙
    </p>

    <button class="btn btn-special">
      de tu gordito mi amor ✨
    </button>

  </div>

</body>
</html>
